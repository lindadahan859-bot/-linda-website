<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תודה על הפנייה | לינדה דהן</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{margin:0;min-height:100vh;background:#f7f4ef;color:#111;font-family:'Heebo',Arial,sans-serif;display:grid;place-items:center}
    .thank-you{width:min(680px,calc(100% - 36px));box-sizing:border-box;background:#fff;border-radius:28px;padding:48px 38px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.09)}
    .mark{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-size:34px;line-height:1}
    h1{font-size:clamp(32px,6vw,48px);margin:0 0 16px}
    p{font-size:19px;line-height:1.8;margin:0 auto 26px;max-width:540px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid #111;color:#111;background:#fff}
    .actions .primary{background:#111;color:#fff}
    @media(max-width:600px){.thank-you{padding:38px 22px}.actions{flex-direction:column}.actions a{width:100%;box-sizing:border-box}}
  </style>
</head>
<body>
  <main class="thank-you">
    <div class="mark" aria-hidden="true">✓</div>
    <h1>תודה, הפרטים התקבלו</h1>
    <p>קיבלתי את הפנייה ואחזור אליכם בהקדם. אם העניין דחוף, אפשר לפנות אליי גם ב-WhatsApp.</p>
    <div class="actions">
      <a class="primary" href="https://wa.me/972507555667" target="_blank" rel="noopener">לפנייה ב-WhatsApp</a>
      <a href="index.html">חזרה לאתר</a>
    </div>
  </main>
  <script src="site-tools.js"></script>
  <script>
    if(typeof gtag==="function"){gtag("event","generate_lead",{event_category:"Contact",event_label:"Thank you page"});}
    if(typeof fbq==="function"){fbq("track","Lead");}
  </script>
</body>
</html>
